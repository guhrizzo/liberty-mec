# Blueprint da Render: cria a API e o Postgres de uma vez (New + > Blueprint, apontando para este repositório).
services:
  - type: web
    name: liberty-mec-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /saude
    # "free" dorme após 15 min sem uso (a 1ª requisição demora ~30 s). Para produção, use "starter".
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # a Render gera um valor aleatório forte
      - key: CORS_ORIGIN
        value: https://liberty-mec.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: liberty-mec-db
          property: connectionString

databases:
  - name: liberty-mec-db
    databaseName: libertymec
    user: libertymec
    # O Postgres "free" da Render expira em 30 dias. Para manter os dados, troque por "basic-256mb" (pago).
    plan: free
